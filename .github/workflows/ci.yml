name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Generate testdata
        run: python tests/gen_testdata.py
      - name: Smoke tests
        run: python tests/test_smoke.py
      - name: MCP handshake
        run: python tests/test_mcp.py
      - name: Agent category e2e
        run: CTF_E2E=1 python tests/test_agent_categories.py